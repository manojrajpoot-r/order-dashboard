<header class="header">

  <div class="header-left">
    <h2>{{ appName }}</h2>
  </div>

  <div class="header-right">

    <button mat-icon-button>
      <mat-icon>notifications</mat-icon>
    </button>

    <button mat-button>
      <mat-icon>account_circle</mat-icon>
      {{ userName }}
    </button>

    <button
      mat-icon-button
      color="warn"
      (click)="logout()">

      <mat-icon>logout</mat-icon>

    </button>

  </div>

</header>
