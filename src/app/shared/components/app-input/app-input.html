<mat-form-field
    appearance="outline"
    class="w-100">

    <mat-label>

        {{ label }}

    </mat-label>

    <input
        matInput
        [type]="type"
        [placeholder]="placeholder"
        [formControl]="control">

    <app-form-error
        [control]="control">
    </app-form-error>

</mat-form-field>
