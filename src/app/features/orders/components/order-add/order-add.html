<div class="page">

    <mat-card>

        <mat-card-header>

            <mat-card-title>
                {{ isEditMode() ? 'Edit Order' : 'Add Order' }}
            </mat-card-title>

        </mat-card-header>

        <mat-divider></mat-divider>

        <mat-card-content>

           <form [formGroup]="form" (ngSubmit)="save()">

                <div class="row">

                    <div class="col">

                        <app-input
                            label="Order Number"
                            placeholder="Enter Order Number"
                            [control]="form.controls.orderNumber">
                        </app-input>

                    </div>

                    <div class="col">

                        <app-input
                            label="Customer Name"
                            placeholder="Enter Customer Name"
                            [control]="form.controls.customerName">
                        </app-input>

                    </div>

                </div>

                <div class="row">

                    <div class="col">

                        <app-input
                            label="Product Code"
                            placeholder="Enter Product Code"
                            [control]="form.controls.productCode">
                        </app-input>

                    </div>

                    <div class="col">

                        <app-input
                            type="number"
                            label="Quantity"
                            [control]="form.controls.quantity">
                        </app-input>

                    </div>

                </div>

                <div class="row">

                    <div class="col">

                        <app-input
                            type="number"
                            label="Total Amount"
                            [control]="form.controls.totalAmount">
                        </app-input>

                    </div>

                    <div class="col">

                        <app-select
                            label="Status"
                            [control]="form.controls.status"
                            [options]="statusOptions">
                        </app-select>

                    </div>

                </div>

               <div class="actions">

                  <app-button
                      type="submit"
                      color="primary"
                      [label]="isEditMode() ? 'Update Order' : 'Create Order'">
                  </app-button>

                    <app-button
                      color="warn"
                      label="Cancel"
                      type="button"
                      (click)="cancel()">
                  </app-button>

                </div>
            </form>

        </mat-card-content>

    </mat-card>

</div>
